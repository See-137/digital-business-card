<!doctype html>

-->

<style>
@font-face{font-family:"Archivo";src:url(/fonts/archivo-expanded-latin.woff2) format("woff2");font-weight:650 800;font-style:normal;font-display:swap}

@font-face{font-family:"Geist Mono";src:url(/fonts/geist-mono-latin-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Archivo Fallback";src:local("Arial Bold"),local("Arial-BoldMT"),local("Liberation Sans Bold");font-weight:650 800;size-adjust:117.5%;ascent-override:74.7%;descent-override:17.9%;line-gap-override:0%}

@font-face{font-family:"Hanken Fallback";src:local("Arial Bold"),local("Arial-BoldMT"),local("Liberation Sans Bold");font-weight:600;size-adjust:100.5%;ascent-override:99.5%;descent-override:30.2%;line-gap-override:0%}
@font-face{font-family:"Geist Mono Fallback";src:local("Courier New"),local("CourierNewPSMT"),local("Liberation Mono");font-weight:400;size-adjust:100%;ascent-override:100.5%;descent-override:29.5%;line-gap-override:0%}
:root{
  --bg:#0c0c0d; --surface-2:#1c1c1e; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --ink:#eeebe6; --ink-2:#b5b1a9; --mute:#8f8b85;
  --accent:#ff5f2e; --accent-text:#ff7a4d; --on-accent:#140803;
  --display:"Archivo","Archivo Fallback",sans-serif;
  --body:"Hanken Grotesk","Hanken Fallback",sans-serif;
  --mono:"Geist Mono","Geist Mono Fallback",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);font:400 1rem/1.6 var(--body);-webkit-font-smoothing:antialiased}
.top{border-bottom:1px solid var(--line)}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
.mark{display:inline-flex;align-items:center;gap:10px;min-height:56px;color:var(--ink);font:650 1rem/1 var(--display);text-decoration:none}
.mark i{width:9px;height:9px;border-radius:2px;background:var(--accent)}
main{flex:1;display:grid;align-content:center;padding-block:clamp(48px,12vh,120px)}
.code{margin:0 0 16px;font:400 .95rem/1 var(--mono);letter-spacing:.14em;color:var(--accent-text)}
h1{margin:0 0 20px;font:800 clamp(2.4rem,8vw,5rem)/1.02 var(--display);letter-spacing:-.01em;text-wrap:balance}
.lede{max-width:52ch;margin:0 0 32px;color:var(--ink-2);font-size:1.1rem}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font:600 .95rem/1 var(--body);text-decoration:none;transition:background-color .2s var(--ease),border-color .2s var(--ease)}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:#ff7347;border-color:#ff7347}
a:focus-visible{outline:2px solid var(--accent-text);outline-offset:3px}
footer{padding-block:24px;border-top:1px solid var(--line);color:var(--mute);font-size:.86rem}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>

    <div class="actions">
      <a class="btn primary" href="/">Back to the home page</a>
      <a class="btn" href="/#work">Selected work</a>
      <a class="btn" href="/#contact">Contact</a>
    </div>
  </div>
</main>
<footer>
  <div class="wrap">Senior SRE &amp; AI Platform Engineer</div>
</footer>
</body>
</html>
