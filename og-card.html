<!DOCTYPE html>
<!-- OG image generator. Render to assets/og-card.png at 1200x630:
     chrome --headless --window-size=1200,630 --virtual-time-budget=3000 \
            --screenshot=assets/og-card.png og-card.html -->
<html lang="en" data-accent="emerald">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #0a0a0c;
    --ink: #f5f5f4;
    --accent: #10b981;
    --accent-bright: #34d399;
    --accent-dim: #059669;
    --muted: #a1a1aa;
    --line: #1d1d22;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', monospace;
    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); position: relative;
  }
  /* grid backdrop */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.35;
    mask-image: radial-gradient(circle at 30% 40%, #000 0%, transparent 80%);
  }
  .glow {
    position: absolute; top: -260px; right: -200px;
    width: 760px; height: 760px;
    background: radial-gradient(circle, rgba(16,185,129,0.18) 0%, transparent 70%);
  }
  .frame {
    position: absolute; inset: 48px;
    border: 1px solid var(--line); border-radius: 14px;
    padding: 56px 64px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: rgba(10,10,12,0.4);
  }
  .topbar {
    display: flex; align-items: center; gap: 14px;
    font-family: var(--mono); font-size: 20px; color: var(--muted);
    letter-spacing: 1px;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ef4444; } .dot.y { background: #eab308; } .dot.g { background: var(--accent); }
  .topbar .path { margin-left: 10px; color: var(--accent); }
  .topbar .live {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    color: var(--accent-bright); font-size: 16px;
  }
  .topbar .live .blip {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent-bright);
    box-shadow: 0 0 12px var(--accent-bright);
  }
  .body { display: flex; flex-direction: column; gap: 6px; }
  .prompt { font-family: var(--mono); font-size: 24px; color: var(--accent); margin-bottom: 18px; }
  .prompt .muted { color: var(--muted); }
  h1 {
    font-family: var(--serif); font-weight: 400;
    font-size: 96px; line-height: 0.98; letter-spacing: -1px;
  }
  h1 .accent { color: var(--accent); font-style: italic; }
  .role {
    font-family: var(--mono); font-size: 30px; color: var(--ink);
    margin-top: 26px; letter-spacing: 0.5px;
  }
  .role .sep { color: var(--accent); }
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--mono); font-size: 19px; color: var(--muted);
    border-top: 1px solid var(--line); padding-top: 22px; letter-spacing: 0.5px;
  }
  .footer .accent { color: var(--accent); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="frame">
    <div class="topbar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="path">c137@console: ~/portfolio</span>
      <span class="live"><span class="blip"></span>LIVE</span>
    </div>
    <div class="body">
      <div class="prompt">$ whoami <span class="muted">--full</span></div>
      <h1>Oleg <span class="accent">Hanukayev</span></h1>
      <div class="role">Platform <span class="sep">·</span> DevOps <span class="sep">·</span> MLOps Engineer</div>
    </div>
    <div class="footer">
      <span>10 years <span class="accent">//</span> F500 SaaS <span class="accent">//</span> Fintech <span class="accent">//</span> AI systems</span>
      <span class="accent">see-137.github.io</span>
    </div>
  </div>
</body>
</html>
